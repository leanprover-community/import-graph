name = "importGraph"
description = "Tools to analyse and visualise the import structure of Lean packages and their files."
license = "Apache-2.0"
licenseFiles = ["LICENSE"]

defaultTargets = ["ImportGraph", "ImportGraphLake", "graph", "import-graph-workspace-summary"]
testRunner = "ImportGraphTest"

[[require]]
name = "Cli"
scope = "leanprover"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "ImportGraph"

[[lean_lib]]
name = "ImportGraphLake"

[[lean_lib]]
name = "ImportGraphTest"

# `lake exe graph` constructs import graphs in `.dot` or graphical formats.
[[lean_exe]]
name = "graph"
root = "executables.Graph"
# Enables the use of the Lean interpreter by the executable (e.g., `runFrontend`)
# at the expense of increased binary size on Linux.
# Remove this line if you do not need such functionality.
supportInterpreter = true

# `lake exe unused_transitive_imports` prints unused transitive imports from amongst a given list of modules.
[[lean_exe]]
name = "unused_transitive_imports"
root = "executables.UnusedTransitiveImports"
supportInterpreter = true

# Emits the packages and lean libraries of a lake workspace as json in a manner suitable for
# inspecting the import hierarchy of modules via source. (Does not emit module data per se.)
# Works around the fact that loading the lake workspace in the language server crashes it.
[[lean_exe]]
name = "import-graph-workspace-summary"
root = "executables.WorkspaceSummary"
supportInterpreter = true
